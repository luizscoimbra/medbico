name: Sincronização Agrofit (base MAPA)

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 (BRT) — verificação diária da fonte oficial
  workflow_dispatch:

concurrency:
  group: agrofit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar base Agrofit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/agrofit-sync.mjs
